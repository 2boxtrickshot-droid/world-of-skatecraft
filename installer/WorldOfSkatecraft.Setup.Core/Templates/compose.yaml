# World of Skatecraft's local server.
#
# Generated by Setup. The deploy version, the image digests and the vmangos revision live in
# `installer/WorldOfSkatecraft.Setup.Core/Upstreams.cs`; never edit this file by hand, run Setup
# again (`Setup.exe --repair`) instead, so the generated file matches the pins.
#
# The three services are vmangos-deploy's (its example Compose file is CC0-1.0, by Michael
# Serajnik); the file is written here rather than copied so that a version-1 deploy can never drift
# from the images it starts. `VMANGOS_DEPLOY_VERSION` is what the images check at startup, and the
# extraction and the `mangosd` service mount the client's `Data` read-only, so the WoW folder is
# never written to.
services:
  database:
    image: @@DATABASE_IMAGE@@
    restart: unless-stopped
    stop_grace_period: 2m # Gives a running startup step time to finish during shutdown.
    healthcheck:
      test: ['CMD', 'vmangos-healthcheck']
      interval: 1m
      timeout: 3s
      retries: 5
      start_period: 24h
    volumes:
      - vmangos-database:/var/lib/mysql
      - ./storage/database/custom-sql:/sql/custom:ro
    environment:
      - VMANGOS_DEPLOY_VERSION=@@DEPLOY_VERSION@@
      - TZ=@@TZ@@
      - MARIADB_USER=@@DATABASE_USER@@
      - MARIADB_PASSWORD=@@DATABASE_PASSWORD@@
      - MARIADB_ROOT_PASSWORD=@@DATABASE_ROOT_PASSWORD@@
      - VMANGOS_REALMLIST_NAME=World of Skatecraft
      - VMANGOS_REALMLIST_ADDRESS=127.0.0.1
      - VMANGOS_REALMLIST_PORT=8085
      - VMANGOS_REALMLIST_ICON=1
      - VMANGOS_REALMLIST_TIMEZONE=0
      - VMANGOS_REALMLIST_ALLOWED_SECURITY_LEVEL=0
      - VMANGOS_ENABLE_AUTOMATIC_WORLD_DB_CORRECTIONS=1
      - VMANGOS_HALT_ON_MIGRATION_EDITS=1
      - VMANGOS_PROCESS_CUSTOM_SQL=1

  realmd:
    image: @@SERVER_IMAGE@@
    command: realmd
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '3724']
      interval: 1m
      timeout: 3s
      retries: 5
      start_period: 5m
    ports:
      - 3724:3724
    volumes:
      - ./config/realmd.conf:/opt/vmangos/config/realmd.conf:ro
      - ./storage/realmd/logs:/opt/vmangos/storage/logs
    environment:
      - VMANGOS_DEPLOY_VERSION=@@DEPLOY_VERSION@@
      - TZ=@@TZ@@
      - VMANGOS_UID=@@UID@@
      - VMANGOS_GID=@@GID@@
      - VMANGOS_DATABASE_USER=@@DATABASE_USER@@
      - VMANGOS_DATABASE_PASSWORD=@@DATABASE_PASSWORD@@

  mangosd:
    # The `&mangosd-image` anchor is used by the tool services below.
    image: &mangosd-image @@SERVER_IMAGE@@
    command: mangosd
    tty: true
    stdin_open: true
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 2m # Gives a busy server time to save during shutdown.
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '8085']
      interval: 1m
      timeout: 3s
      retries: 5
      start_period: 5m
    ports:
      - 8085:8085
    volumes:
      - ./config/mangosd.conf:/opt/vmangos/config/mangosd.conf:ro
      - ./storage/mangosd/extracted-data:/opt/vmangos/storage/data:ro
      - ./storage/mangosd/logs:/opt/vmangos/storage/logs
      - ./storage/mangosd/honor:/opt/vmangos/storage/honor
    environment: &mangosd-environment
      - VMANGOS_DEPLOY_VERSION=@@DEPLOY_VERSION@@
      - TZ=@@TZ@@
      - VMANGOS_UID=@@UID@@
      - VMANGOS_GID=@@GID@@
      - VMANGOS_DATABASE_USER=@@DATABASE_USER@@
      - VMANGOS_DATABASE_PASSWORD=@@DATABASE_PASSWORD@@

  # Runs only on demand: the map extraction reads the client's own data out of the scratch folder
  # the setup mounts, because the extractors write beside the client's `Data`.
  extract-client-data:
    image: *mangosd-image
    profiles: ['tools']
    entrypoint: ['extract-client-data']
    volumes:
      - ./storage/mangosd/client-data:/opt/vmangos/storage/client-data
      - ./storage/mangosd/extracted-data:/opt/vmangos/storage/data
    environment: *mangosd-environment

volumes:
  vmangos-database:
